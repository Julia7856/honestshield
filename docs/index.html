<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>honesty.txt — web validator</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;margin:0 auto;padding:24px;max-width:720px}
  h1{font-size:22px}
  h2{font-size:16px;margin-top:18px}
  a{color:#58a6ff}
  input,textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:6px;border:1px solid #30363d;background:#161b22;color:#e6edf3}
  input[readonly]{font-family:monospace;font-size:12px}
  textarea{min-height:160px;font-family:monospace;font-size:13px}
  button{background:#238636;border:none;color:#fff;cursor:pointer}
  .badge{display:inline-block;padding:4px 10px;border-radius:4px;font-size:13px;margin:10px 0}
  .ok{background:#238636}.warn{background:#9e6a03}.fail{background:#da3633}
  ul{list-style:none;padding:0}
  li{padding:4px 0;border-bottom:1px solid #21262d;font-size:14px}
  .yes::before{content:"✓ ";color:#3fb950}
  .no::before{content:"✗ ";color:#f85149}
  .wn::before{content:"! ";color:#d29922}
  .inf::before{content:"⏳ ";color:#58a6ff}
</style>
</head>
<body>
<h1>honesty.txt — web validator</h1>
<p>Reference: <a href="https://github.com/Julia7856/honestshield">github.com/Julia7856/honestshield</a></p>
<input id="url" placeholder="https://example.com (optional)">
<button onclick="byUrl()">Check by URL</button>
<p style="text-align:center;opacity:.6">— or paste the file below —</p>
<textarea id="txt" placeholder="# HONESTY.TXT — v1 ..."></textarea>
<button onclick="run(document.getElementById('txt').value)">Validate text</button>
<div id="out"></div>
<div id="extra" style="display:none">
  <h2>Share the report</h2>
  <input id="shareurl" readonly>
  <button onclick="copyField('shareurl',this)">Copy link</button>
  <h2>Badge for the site</h2>
  <input id="badgesnippet" readonly>
  <button onclick="copyField('badgesnippet',this)">Copy badge code</button>
</div>
<script>
function enc(t){return btoa(unescape(encodeURIComponent(t)));}
function dec(s){return decodeURIComponent(escape(atob(s)));}
async function byUrl(){
  let u=document.getElementById('url').value.trim();
  if(!u)return;
  if(!/^https?:\/\//.test(u))u='https://'+u;
  if(!u.endsWith('.txt'))u=u.replace(/\/$/,'')+'/.well-known/honesty.txt';
  const out=document.getElementById('out');
  out.innerHTML='<p>Fetching…</p>';
  let text=null;
  try{
    const r=await fetch(u);
    if(r.ok)text=await r.text();
  }catch(e){}
  if(text===null){
    try{
      const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));
      if(r.ok)text=await r.text();
    }catch(e){}
  }
  if(text===null){
    out.innerHTML='<div class="badge fail">cannot fetch URL</div><p>The site blocks cross-origin requests and the proxy is unavailable. Paste the file text below instead.</p>';
    return;
  }
  run(text);
}
function run(text){
  const header={},sections={};let cur=null;
  for(const raw of text.split('\n')){
    const line=raw.trim();
    if(line.startsWith('## ')){cur=line.slice(3).trim().toUpperCase();sections[cur]=[];continue;}
    if(!line||line.startsWith('#'))continue;
    if(cur===null){const m=line.match(/^([A-Za-z-]+):\s*(.*)$/);if(m)header[m[1]]=m[2];}
    else sections[cur].push(line);
  }
  const checks=[];
  const req=(ok,t,w)=>checks.push({ok,w:!!w,t});
  ['App','Host','Contact','Updated','Expires'].forEach(k=>req(!!header[k],'Header field: '+k));
  if(header.Expires)req(new Date(header.Expires)>new Date(),'Expires is in the future',true);
  if(header.Expires){
    const ex=new Date(header.Expires);
    if(!isNaN(ex)){
      const d=Math.ceil((ex-Date.now())/86400000);
      if(d>=0&&d<30)checks.push({ok:false,w:true,t:'Expires soon: '+d+' day(s) left'});
      else if(d>=0)checks.push({i:true,ok:true,t:'Expires in '+d+' days'});
    }
  }
  if(header.Updated){
    const up=new Date(header.Updated);
    if(!isNaN(up)){
      const du=Math.floor((Date.now()-up)/86400000);
      if(du>=0&&du>365)checks.push({ok:false,w:true,t:'Stale declaration: updated '+du+' days ago'});
      else if(du>=0)checks.push({i:true,ok:true,t:'Updated '+du+' days ago'});
    }
  }
  const data=sections.DATA||[];
  req(data.length>0,'DATA section is not empty');
  data.forEach(l=>{const n=l.split(':')[0];
    req(/purpose=/.test(l),'DATA '+n+': purpose');
    req(/retain=/.test(l),'DATA '+n+': retain',true);
    req(/shared=/.test(l),'DATA '+n+': shared',true);});
  req('TRACKERS' in sections,'TRACKERS section declared');
  const pr=(sections.PROMISES||[]).join('\n');
  req(/sell-data:\s*no/.test(pr),'PROMISES: sell-data: no');
  req(/delete-on-request/.test(pr),'PROMISES: delete-on-request',true);
  const fails=checks.filter(c=>!c.ok&&!c.w).length;
  const warns=checks.filter(c=>!c.ok&&c.w).length;
  const state=fails?'failed':(warns?'warnings':'verified');
  const col={verified:'ok',warnings:'warn',failed:'fail'}[state];
  let html='<div class="badge '+col+'">honesty.txt: '+state+'</div><ul>';
  for(const c of checks){
    const cls=c.i?'inf':(c.ok?'yes':(c.w?'wn':'no'));
    html+='<li class="'+cls+'">'+c.t+'</li>';
  }
  document.getElementById('out').innerHTML=html+'</ul>';
  const base=location.href.split('#')[0];
  document.getElementById('shareurl').value=base+'#check='+enc(text);
  const badge={verified:'badge-verified.svg',warnings:'badge-warnings.svg',failed:'badge-failed.svg'}[state];
  document.getElementById('badgesnippet').value='<img src="https://raw.githubusercontent.com/Julia7856/honestshield/main/assets/'+badge+'" alt="honesty.txt: '+state+'" height="20">';
  document.getElementById('extra').style.display='block';
}
function copyField(id,btn){
  const el=document.getElementById(id);
  el.select();el.setSelectionRange(0,99999);
  try{navigator.clipboard.writeText(el.value);}catch(e){document.execCommand('copy');}
  const old=btn.textContent;btn.textContent='Copied!';setTimeout(function(){btn.textContent=old;},1500);
}
window.addEventListener('load',function(){
  const m=location.hash.match(/^#check=(.+)$/);
  if(m){try{const t=dec(m[1]);document.getElementById('txt').value=t;run(t);}catch(e){}}
});
</script>
</body>
</html>
