name: validate-examples

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate messenger example
        run: python validator/validate.py examples/messenger.honesty.txt
      - name: Validate shop example
        run: python validator/validate.py examples/shop.honesty.txt
